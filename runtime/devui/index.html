<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kuronami DevUI</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f4;
        --panel: #fff;
        --line: #d9d9d3;
        --ink: #1c1c1a;
        --muted: #6a6a63;
        --accent: #2b6cb0;
        --ok: #2f7d32;
        --warn: #b4690e;
        --err: #b02a2a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171a;
          --panel: #202024;
          --line: #34343a;
          --ink: #e7e7e3;
          --muted: #9a9a92;
          --accent: #6fa8dc;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        align-items: baseline;
      }
      header h1 { font-size: 13px; margin: 0; font-weight: 700; }
      header .meta { color: var(--muted); }
      main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 38px); }
      #list { border-right: 1px solid var(--line); overflow-y: auto; }
      #detail { overflow-y: auto; padding: 12px 16px; }
      .sess {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .sess:hover { background: var(--panel); }
      .sess.active { background: var(--panel); border-left: 3px solid var(--accent); }
      .sess .id { font-weight: 700; }
      .sess .sub { color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
      .badge {
        display: inline-block;
        padding: 0 6px;
        border-radius: 3px;
        border: 1px solid var(--line);
        font-size: 11px;
      }
      .badge.running { color: var(--accent); border-color: var(--accent); }
      .badge.awaiting_user { color: var(--warn); border-color: var(--warn); }
      .badge.completed { color: var(--ok); border-color: var(--ok); }
      .badge.failed, .badge.canceled { color: var(--err); border-color: var(--err); }
      .badge.live { color: var(--ok); border-color: var(--ok); }
      h2 { font-size: 13px; margin: 16px 0 6px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 10px 12px;
      }
      .ask { border-color: var(--warn); }
      .ask button {
        font: inherit;
        margin: 6px 6px 0 0;
        padding: 5px 12px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--accent);
        border-radius: 3px;
        cursor: pointer;
      }
      .ask button:hover { background: var(--accent); color: #fff; }
      .ask button:disabled { opacity: 0.4; cursor: default; }
      table { border-collapse: collapse; width: 100%; }
      td, th { text-align: left; padding: 2px 10px 2px 0; vertical-align: top; }
      th { color: var(--muted); font-weight: 400; }
      .trail { max-height: 260px; overflow-y: auto; }
      .trail .row { display: flex; gap: 10px; }
      .trail .seq { color: var(--muted); min-width: 28px; text-align: right; }
      .trail .t { color: var(--muted); min-width: 88px; }
      .msg { border-top: 1px solid var(--line); padding: 6px 0; white-space: pre-wrap; word-break: break-word; }
      .msg .role { color: var(--muted); }
      .msg.assistant .role { color: var(--accent); }
      .kv { color: var(--muted); }
      .empty { color: var(--muted); padding: 24px 0; }
      details > summary { cursor: pointer; color: var(--muted); margin-top: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Kuronami DevUI</h1>
      <span class="meta" id="hdr">lädt…</span>
    </header>
    <main>
      <div id="list"><div class="empty" style="padding-left:12px">lädt…</div></div>
      <div id="detail"><div class="empty">Keine Session gewählt.</div></div>
    </main>
    <script>
      const $ = (sel) => document.querySelector(sel);
      let selected = null;
      let busy = false;

      const esc = (s) =>
        String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      const shortId = (id) => String(id).replace(/^(session|thread)_/, "").slice(0, 12);
      const clock = (iso) => new Date(iso).toLocaleTimeString("de-DE");

      async function getJSON(url, opts) {
        const res = await fetch(url, opts);
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
        return res.json();
      }

      async function loadSessions() {
        try {
          const { sessions } = await getJSON("/sessions");
          $("#hdr").textContent = sessions.length + " Session(s)";
          $("#list").innerHTML =
            sessions
              .map((s) => {
                const cls = s.sessionId === selected ? "sess active" : "sess";
                const live = s.live ? '<span class="badge live">live</span>' : "";
                const wait = s.awaiting ? '<span class="badge awaiting_user">wartet</span>' : "";
                return `<div class="${cls}" data-id="${s.sessionId}">
                  <div class="id">${esc(shortId(s.sessionId))}</div>
                  <div class="sub">
                    <span class="badge ${s.status}">${s.status}</span>${live}${wait}
                    <span>${s.steps} Schritt(e)</span>
                    <span>${clock(s.createdAt)}</span>
                  </div></div>`;
              })
              .join("") || '<div class="empty" style="padding-left:12px">keine</div>';
        } catch (e) {
          $("#hdr").textContent = "Fehler: " + e.message;
        }
      }

      function renderBlock(b) {
        if (b.type === "text") return esc(b.text);
        if (b.type === "tool_use")
          return `<span class="kv">tool_use</span> ${esc(b.name)} ${esc(JSON.stringify(b.input))}`;
        if (b.type === "tool_result") {
          const body =
            typeof b.content === "string" ? b.content : JSON.stringify(b.content);
          return `<span class="kv">tool_result${b.is_error ? " (Fehler)" : ""}</span> ${esc(
            body.slice(0, 600),
          )}`;
        }
        if (b.type === "thinking") return `<span class="kv">thinking …</span>`;
        return `<span class="kv">${esc(b.type)}</span>`;
      }

      async function loadDetail(id) {
        if (!id) return;
        try {
          const d = await getJSON(`/sessions/${id}/events`);
          const s = d.session;
          const L = d.loop;
          const ask = s.pendingUserInput
            .map(
              (p) => `<div class="panel ask">
                <div><b>Rückfrage:</b> ${esc(p.question)}</div>
                <div class="kv">${esc(p.askId)}</div>
                <div>${p.options
                  .map(
                    (o) =>
                      `<button data-ask="${esc(p.askId)}" data-choice="${esc(
                        o.id,
                      )}">${esc(o.label)} (${esc(o.id)})</button>`,
                  )
                  .join("")}</div>
              </div>`,
            )
            .join("");

          const steps = s.steps.length
            ? `<table><tr><th>Tool</th><th>Status</th><th>Versuch</th></tr>${s.steps
                .map(
                  (st) =>
                    `<tr><td>${esc(st.toolName ?? "—")}</td><td>${esc(
                      st.status,
                    )}</td><td>${st.attempt}</td></tr>`,
                )
                .join("")}</table>`
            : '<div class="kv">noch keine Schritte</div>';

          const trail = d.events
            .map(
              (e) =>
                `<div class="row"><span class="seq">${e.seq}</span><span class="t">${clock(
                  e.createdAt,
                )}</span><span>${esc(e.type)}</span></div>`,
            )
            .join("");

          const transcript = L.messages
            .map(
              (m) =>
                `<div class="msg ${m.role}"><span class="role">${m.role}</span>\n${m.content
                  .map(renderBlock)
                  .join("\n")}</div>`,
            )
            .join("");

          $("#detail").innerHTML = `
            <h2>${esc(shortId(id))} — <span class="badge ${s.status}">${s.status}</span>${
              d.live ? ' <span class="badge live">live</span>' : ""
            }</h2>
            <div class="kv">Zug ${L.turnId ? "offen" : "—"} · ${L.toolCalls} Aufruf(e) · ${
              L.consecutiveErrors
            } Fehler in Folge · ${L.offloadedResults} ausgelagert</div>
            ${ask}
            <h2>Schritte</h2>${steps}
            <h2>Ereignisse (${d.events.length})</h2><div class="panel trail">${trail}</div>
            <details><summary>Roh-Verlauf (deriveLoopState, ${L.messages.length} Nachrichten)</summary>${transcript}</details>
          `;

          $("#detail")
            .querySelectorAll("button[data-ask]")
            .forEach((btn) =>
              btn.addEventListener("click", async () => {
                if (busy) return;
                busy = true;
                $("#detail")
                  .querySelectorAll("button[data-ask]")
                  .forEach((b) => (b.disabled = true));
                try {
                  await getJSON(`/sessions/${id}/answer`, {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({
                      askId: btn.dataset.ask,
                      choiceId: btn.dataset.choice,
                    }),
                  });
                } catch (e) {
                  alert("Antwort fehlgeschlagen: " + e.message);
                } finally {
                  busy = false;
                  loadDetail(id);
                }
              }),
            );
        } catch (e) {
          $("#detail").innerHTML = `<div class="empty">Fehler: ${esc(e.message)}</div>`;
        }
      }

      $("#list").addEventListener("click", (ev) => {
        const el = ev.target.closest(".sess");
        if (!el) return;
        selected = el.dataset.id;
        loadSessions();
        loadDetail(selected);
      });

      async function tick() {
        await loadSessions();
        if (selected) await loadDetail(selected);
      }
      tick();
      setInterval(tick, 1500);
    </script>
  </body>
</html>
