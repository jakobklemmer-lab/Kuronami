[pytest]
# Der Testlauf der Sprachschicht. Er läuft im Container (`docker compose run --rm voice-test`),
# weil Pipecat Python ist und auf diesem Rechner kein Python installiert sein muss — die
# Prozessgrenze aus Abschnitt 4.1 gilt auch für die Tests.
testpaths = pipeline/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
