<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kuronami</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/theme.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/views.css" />
    <link rel="stylesheet" href="./styles/praesenz.css" />
    <link rel="stylesheet" href="./styles/anmeldung.css" />
    <!-- Die Schrift der Hülle (Manrope) und das Kanji der Leiste; die Anmeldemaske bringt ihre
         eigene Schriftliste mit (`styles/anmeldung.css`). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500&family=Zen+Kaku+Gothic+New:wght@400&display=swap" />
  </head>
  <body>
    <!--
      Nur die Hülle: Raum und Leiste (`ui/praesenz/huelle.ts`), der Auslass für genau eine
      Ansicht und der Toast. Aller Inhalt kommt aus `ui/main.ts` über die Ansichten; die
      Anmeldemaske legt sich bei Bedarf selbst darüber (`ui/auth/view.ts`).
    -->

    <div id="huelle"></div>

    <div class="app-shell">
      <main id="view-outlet" aria-live="polite"></main>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
