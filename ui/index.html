<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kuronami</title>
    <link rel="stylesheet" href="./styles/theme.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/views.css" />
  </head>
  <body>
    <!--
      Nur die Hülle: Szene (das Foto), Seitenleiste, Ansichts-Auslass, Eingabezeile und Toast.
      Aller Inhalt kommt aus `ui/main.ts` über die Ansichten in `ui/views/`.

      Die Anordnung folgt der Bildvorlage `dashboard_beispiel.png` (vom Nutzer als verbindlich
      erklärt): sichtbares Hintergrundfoto, dunkle Glaskarten darüber, Mic-Pille unten in der
      Seitenleiste.
    -->

    <div class="scene" id="scene" aria-hidden="true"></div>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" data-collapsed="false"></aside>
      <main id="view-outlet" aria-live="polite"></main>
    </div>

    <div id="composer-host"></div>
    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
