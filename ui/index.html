<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kuronami</title>
    <link rel="stylesheet" href="./styles/theme.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/views.css" />
  </head>
  <body>
    <!--
      UI-Zwischenschub (siehe progress.md, Eintrag "UI-Zwischenschub"): reine Oberflächen-
      Überarbeitung des bestehenden Dashboards, kein Sprint der S-Reihe. Home zeigt seither ein
      persönliches Cockpit gegen Mock-Daten (`ui/views/home.ts`); der bisherige echte Inhalt
      (Läufe/Freigaben/Fehler/Kennzahlen, S22–S24) ist unverändert in seiner Anbindung, nur
      umgezogen auf eine eigene Route (`ui/views/system.ts`, `#/system`). Jede Ansicht ist eine
      eigene, direkt aufrufbare Hash-Route (`ui/router/router.ts`) — kein SPA-Fallback am
      Ausliefer-Server nötig, siehe dessen Begründung dort.

      Diese Datei enthält nur die App-Hülle (Szene, Seitenleiste, Ansichts-Auslass, Mic-Dock,
      Toast) — Inhalt kommt ausschließlich aus `ui/main.ts` über die Ansichten in `ui/views/`.
    -->

    <div class="scene" id="scene" aria-hidden="true"></div>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" data-collapsed="false"></aside>
      <main id="view-outlet" aria-live="polite"></main>
    </div>

    <div class="mic-dock" id="mic-dock" data-agent-state="idle"></div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
